[project]
name = "pythonproject-taest-32"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
]

[tool.poetry]
package-mode = false

[dependency-groups]
dev = [
    "autopep8>=2.3.2",
    "flake8>=7.1.1",
    "mypy>=1.11.0",
    "isort>=5.13.2",
    "black>=24.8.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
exclude = 'venv'

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = 'venv'




